[project]
name = "interview-gpu-training"
version = "0.1.0"
description = "GPU training, evaluation and inference pipelines for a persona-based interview AI (speech / video behavior / answer evaluation / multimodal fusion)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "transformers>=4.44",
    "accelerate>=0.33",
    "datasets>=2.20",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "mediapipe>=0.10.14",
    "pyyaml>=6",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# LoRA fine-tuning of the answer encoder (Stage C).
lora = ["peft>=0.11"]
# 4-bit / 8-bit loading of the local Stage-A judge (scripts/label_answers.py).
labeling = ["bitsandbytes>=0.45; sys_platform != 'darwin'"]
# Optional experiment tracking. Training never requires it.
wandb = ["wandb"]
# Optional feature extractors / backbones.
extras = ["timm", "opensmile"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_gpu"]

# PyTorch wheels built against CUDA 12.8 (required for RTX 50-series, works on
# 20/30/40-series too). macOS falls back to the default PyPI (MPS/CPU) wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
